# Metaspace is sized for the Kotlin compiler plugin loading in-process; at 384m the daemon
# expired mid-build on this host.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false

# :app depends on androidx.core:core-ktx, so AndroidX has to be enabled. AGP refuses to build
# otherwise (checkDebugAarMetadata fails).
android.useAndroidX=true

# The Kotlin compiler runs inside the Gradle daemon instead of forking a second JVM.
# A phone/PRoot host does not have the spare RAM for an extra daemon heap.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
kotlin.incremental=true
