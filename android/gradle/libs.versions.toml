[versions]
kotlin = "2.1.0"
coroutines = "1.9.0"
serialization = "1.7.3"
# The `rx` package that both published ABI surfaces import is RxJava **1**, not RxJava 2.
# tachiyomix 1.4.4 (library/build.gradle) and 1.6.0 (gradle/libs.versions.toml) both declare
# io.reactivex:rxjava:1.3.8. rxjava2 ships io.reactivex.* and would leave every 1.4 and 1.6
# extension uncompilable against these stubs.
rxjava = "1.3.8"
junit = "5.11.4"
agp = "8.7.3"
androidx-core = "1.13.1"
androidx-preference = "1.2.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
