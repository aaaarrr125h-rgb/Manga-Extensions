name: Android Release

# Builds and publishes a signed Shura release APK.
#
# The release is signed with the same stable key the debug build uses (cached, never committed),
# because no separate release key exists and creating one would break update-in-place for anyone
# already on a debug build. See app/build.gradle.kts for the signing configuration.
#
# This does not run on every push. A release is a deliberate act, so it is started by hand or by
# pushing a tag, and it names the version tag it publishes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          test -n "$TAG" || { echo "::error::no release tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Record build identity
        id: identity
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER" || { echo "::error::no sdkmanager found under $SDK_ROOT/cmdline-tools"; exit 1; }
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Restore stable signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/shura-ci.keystore
          key: shura-ci-debug-keystore-v1

      - name: Create stable keystore on first use
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/shura-ci.keystore \
            -storepass shura-ci -keypass shura-ci \
            -alias shura-ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Shura CI Debug, O=Shura, C=US"

      - name: Assemble and test
        working-directory: android
        run: |
          ./gradlew --no-daemon clean :shura-source-host:test :app:assembleRelease \
            -PshuraGitSha=${{ steps.identity.outputs.sha }} \
            -PshuraBuildTime=${{ steps.identity.outputs.build_time }}

      - name: Verify the release APK
        id: apk
        run: |
          mapfile -t APKS < <(find android/app/build/outputs/apk/release -name '*.apk' | sort)
          printf 'APKs produced: %d\n' "${#APKS[@]}"
          printf '  %s\n' "${APKS[@]:-<none>}"
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::expected exactly one release APK, found ${#APKS[@]}"
            exit 1
          fi
          APK="${APKS[0]}"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          CERT="$(apksigner verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$CERT" || { echo "::error::could not read the signing certificate"; exit 1; }
          echo "path=$APK"  >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$APK")" >> "$GITHUB_OUTPUT"
          {
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`${{ steps.identity.outputs.sha }}\` |"
            echo "| size | $(stat -c %s "$APK") bytes |"
            echo "| sha256 | \`$SHA\` |"
            echo "| signing certificate | \`$CERT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the APK carries this build's identity
        run: |
          APK="${{ steps.apk.outputs.path }}"
          for TEXT in "${{ steps.identity.outputs.sha }}" "${{ steps.identity.outputs.build_time }}"; do
            if unzip -p "$APK" 'classes*.dex' | grep -aF -q "$TEXT"; then
              echo "ok: $TEXT is present in the dex"
            else
              echo "::error::$TEXT is missing from the dex"
              exit 1
            fi
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shura-release-${{ steps.identity.outputs.short_sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          APK="${{ steps.apk.outputs.path }}"
          ASSET="shura-$TAG-$(basename "$APK")"
          cp "$APK" "$ASSET"
          NOTES="Signed release of Shura $TAG, built from \`${{ steps.identity.outputs.sha }}\`.

          - APK SHA-256: \`${{ steps.apk.outputs.sha }}\`
          - Signing certificate SHA-256: \`${{ steps.apk.outputs.cert }}\`
          - Signed with the same stable key as the debug builds, so it installs over them.

          This build is minified (R8). It has not been exercised on a physical device by CI; see
          \`android/ON_DEVICE_TEST_PLAN.md\` for the checks to run before relying on it."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "Shura $TAG" --notes "$NOTES" --verify-tag=false
          fi
