name: Android Build

# Builds the Shura debug APK.
#
# This runs on an x86-64 runner on purpose: aapt2 is published only as an x86-64 binary, so the
# app module cannot be built on the aarch64/PRoot host this project is developed on. The
# Foundation modules build and test fine on any JDK-17 machine, but :app needs a real x86-64
# runner.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # The ubuntu-24.04 image already ships cmdline-tools, so this step only has to locate it
        # and accept licenses. android-actions/setup-android@v3 is deliberately not used: it runs
        # `sdkmanager tools`, and Google removed that legacy package, so the action always exits 1.
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER" || { echo "::error::no sdkmanager found under $SDK_ROOT/cmdline-tools"; exit 1; }
          echo "SDK root   : $SDK_ROOT"
          echo "sdkmanager : $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        # compileSdk/targetSdk 34 in app/build.gradle.kts pins the platform; build-tools 34.0.0 is
      # the default for AGP 8.7.3. platform-tools is not strictly needed to assemble, but it is
      # what AGP expects to find and it keeps the SDK complete.
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Show SDK layout
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkmanager --list_installed

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          ls -l "$APK"
          du -h "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shura-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
